<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Bites de pollo con waffle y dip de chocolate">
  <defs>
    <pattern id="bGingham" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#fffdf8"/>
      <rect width="13" height="26" fill="#e2546a" opacity=".16"/>
      <rect width="26" height="13" fill="#e2546a" opacity=".16"/>
    </pattern>
    <radialGradient id="bNug" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#ffe1a0"/>
      <stop offset=".45" stop-color="#eeab46"/>
      <stop offset=".85" stop-color="#c47a24"/>
      <stop offset="1" stop-color="#9a5512"/>
    </radialGradient>
    <linearGradient id="bWaffle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c065"/>
      <stop offset=".55" stop-color="#e2a03e"/>
      <stop offset="1" stop-color="#b97420"/>
    </linearGradient>
    <radialGradient id="bDip" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6b3a1d"/>
      <stop offset="1" stop-color="#2e1608"/>
    </radialGradient>
    <filter id="bCrisp" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".08 .1" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="bSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="268" rx="108" ry="16" fill="#03102e" opacity=".5" filter="url(#bSoft)"/>

  <g transform="rotate(-7 160 160)">
    <rect x="34" y="72" width="252" height="176" rx="8" fill="url(#bGingham)" stroke="#e7ded1" stroke-width="2"/>
    <rect x="34" y="72" width="252" height="176" rx="8" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="6"/>
  </g>

  <g transform="rotate(-14 78 216)">
    <rect x="30" y="182" width="98" height="82" rx="12" fill="url(#bWaffle)"/>
    <g stroke="#a9661b" stroke-width="5" stroke-linecap="round" opacity=".75">
      <path d="M57 186 V262"/><path d="M84 186 V262"/><path d="M111 186 V262"/>
      <path d="M34 208 H124"/><path d="M34 234 H124"/>
    </g>
    <rect x="30" y="182" width="98" height="82" rx="12" fill="none" stroke="#8f5313" stroke-width="3"/>
    <ellipse cx="60" cy="196" rx="22" ry="7" fill="#ffe0a6" opacity=".5"/>
  </g>

  <g filter="url(#bCrisp)">
    <ellipse cx="106" cy="132" rx="34" ry="27" fill="url(#bNug)"/>
    <ellipse cx="152" cy="112" rx="31" ry="25" fill="url(#bNug)"/>
    <ellipse cx="198" cy="126" rx="33" ry="26" fill="url(#bNug)"/>
    <ellipse cx="234" cy="158" rx="27" ry="22" fill="url(#bNug)"/>
    <ellipse cx="128" cy="170" rx="32" ry="25" fill="url(#bNug)"/>
    <ellipse cx="180" cy="172" rx="30" ry="24" fill="url(#bNug)"/>
    <ellipse cx="86" cy="172" rx="22" ry="18" fill="url(#bNug)"/>
  </g>
  <g fill="#fff0c8" opacity=".45">
    <circle cx="96" cy="122" r="5"/><circle cx="146" cy="102" r="4"/><circle cx="192" cy="118" r="5"/>
    <circle cx="228" cy="150" r="4"/><circle cx="122" cy="162" r="5"/><circle cx="176" cy="166" r="4"/>
  </g>

  <g>
    <ellipse cx="240" cy="224" rx="34" ry="28" fill="#1d0f06" opacity=".35" filter="url(#bSoft)"/>
    <circle cx="238" cy="220" r="32" fill="#f6f2e8"/>
    <circle cx="238" cy="220" r="26" fill="url(#bDip)"/>
    <ellipse cx="230" cy="210" rx="9" ry="5" fill="#fff" opacity=".22"/>
  </g>
</svg>
