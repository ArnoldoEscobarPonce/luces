<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Taquitos de pollo con salsa">
  <defs>
    <linearGradient id="tPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e3d6"/>
    </linearGradient>
    <linearGradient id="tRoll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98c"/>
      <stop offset=".45" stop-color="#eda544"/>
      <stop offset="1" stop-color="#a35c14"/>
    </linearGradient>
    <linearGradient id="tSalsa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e23c2a"/>
      <stop offset="1" stop-color="#8b1408"/>
    </linearGradient>
    <filter id="tCrisp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".09 .11" numOctaves="3" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="tSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="266" rx="106" ry="16" fill="#03102e" opacity=".5" filter="url(#tSoft)"/>

  <g transform="rotate(-5 160 170)">
    <rect x="36" y="104" width="248" height="150" rx="6" fill="url(#tPaper)"/>
    <rect x="36" y="104" width="248" height="150" rx="6" fill="none" stroke="#d7cdba" stroke-width="2"/>
  </g>

  <g transform="rotate(-13 118 166)" filter="url(#tCrisp)">
    <rect x="54" y="144" width="134" height="40" rx="20" fill="url(#tRoll)"/>
    <ellipse cx="57" cy="164" rx="11" ry="18" fill="#f8e2ae"/>
    <path d="M74 150 H172 M74 164 H180 M78 178 H164" stroke="#b9711f" stroke-width="3.4" opacity=".45"/>
  </g>

  <g transform="rotate(-3 160 136)" filter="url(#tCrisp)">
    <rect x="76" y="112" width="146" height="42" rx="21" fill="url(#tRoll)"/>
    <ellipse cx="79" cy="133" rx="11" ry="19" fill="#f8e2ae"/>
    <path d="M96 118 H206 M96 132 H214 M98 146 H200" stroke="#b9711f" stroke-width="3.4" opacity=".45"/>
  </g>

  <g transform="rotate(9 200 186)" filter="url(#tCrisp)">
    <rect x="142" y="164" width="134" height="40" rx="20" fill="url(#tRoll)"/>
    <ellipse cx="273" cy="184" rx="11" ry="18" fill="#f8e2ae"/>
    <path d="M158 170 H254 M154 184 H260 M160 198 H246" stroke="#b9711f" stroke-width="3.4" opacity=".45"/>
  </g>

  <g fill="#ffe2a6" opacity=".5">
    <circle cx="120" cy="160" r="4"/><circle cx="150" cy="132" r="4"/><circle cx="196" cy="146" r="4"/><circle cx="222" cy="182" r="4"/>
  </g>

  <g>
    <ellipse cx="252" cy="232" rx="30" ry="24" fill="#1b0d06" opacity=".3" filter="url(#tSoft)"/>
    <circle cx="250" cy="228" r="27" fill="#f7f2e7"/>
    <circle cx="250" cy="228" r="21" fill="url(#tSalsa)"/>
    <ellipse cx="242" cy="220" rx="7" ry="4" fill="#fff" opacity=".3"/>
  </g>
</svg>
