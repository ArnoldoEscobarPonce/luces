<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Pierna de pollo frita">
  <defs>
    <radialGradient id="pMeat" cx="38%" cy="26%" r="82%">
      <stop offset="0" stop-color="#ffdf9d"/>
      <stop offset=".40" stop-color="#f0ad49"/>
      <stop offset=".76" stop-color="#cd8127"/>
      <stop offset="1" stop-color="#8f4c11"/>
    </radialGradient>
    <linearGradient id="pBone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#ddc19a"/>
    </linearGradient>
    <filter id="pCrisp" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency=".06 .085" numOctaves="4" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="274" rx="92" ry="16" fill="#03102e" opacity=".55" filter="url(#pSoft)"/>

  <g>
    <path d="M124 192 L86 240" stroke="url(#pBone)" stroke-width="30" stroke-linecap="round" fill="none"/>
    <ellipse cx="82" cy="248" rx="24" ry="19" fill="#fffaf0" transform="rotate(-42 82 248)"/>
    <ellipse cx="64" cy="262" rx="17" ry="14" fill="#f4e3c4" transform="rotate(-42 64 262)"/>
    <ellipse cx="76" cy="242" rx="8" ry="5" fill="#ffffff" opacity=".75" transform="rotate(-42 76 242)"/>
  </g>

  <g transform="rotate(-34 182 142)" filter="url(#pCrisp)">
    <ellipse cx="182" cy="142" rx="92" ry="64" fill="url(#pMeat)"/>
    <circle cx="146" cy="120" r="14" fill="#b96d1d" opacity=".45"/>
    <circle cx="202" cy="106" r="11" fill="#b4631a" opacity=".40"/>
    <circle cx="228" cy="156" r="13" fill="#a95a16" opacity=".38"/>
    <circle cx="176" cy="184" r="12" fill="#b4631a" opacity=".35"/>
    <circle cx="132" cy="162" r="10" fill="#c07a26" opacity=".45"/>
    <circle cx="210" cy="126" r="8" fill="#ffe0a4" opacity=".55"/>
    <circle cx="158" cy="142" r="7" fill="#ffdf9d" opacity=".5"/>
    <circle cx="192" cy="170" r="6" fill="#ffe6b1" opacity=".45"/>
    <ellipse cx="158" cy="110" rx="36" ry="18" fill="#ffe3a6" opacity=".28"/>
    <ellipse cx="224" cy="128" rx="16" ry="24" fill="#ffcf87" opacity=".22"/>
  </g>
</svg>
